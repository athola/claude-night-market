# Lexicons for the STE-derived structural checks in ``scribe.ste``.
#
# ORIGIN AND LICENSING
#
# These word lists are this project's own work. They are NOT the
# ASD-STE100 controlled dictionary and are not derived from it. The
# official dictionary of approved and unapproved words is copyright ASD
# and cannot be redistributed here, so nothing in this file attempts to
# reproduce it. See the ``licensing`` module of the
# ``scribe:simplified-technical-english`` skill.
#
# What these lists actually do:
#
# - ``imperative_verbs`` lets the classifier recognize an instruction by
#   its opening verb, so procedural and descriptive text get their
#   different sentence-length limits. It is a list of verbs common in
#   technical instructions, not a list of "approved" words.
# - ``descriptive_starters`` recognizes the opposite signal: a sentence
#   that opens with a subject, determiner, or subordinator explains
#   rather than instructs.
# - ``function_words`` is subtracted from token runs to find noun
#   clusters. Anything left after subtraction is treated as noun-like.
#
# QUOTING RULE: "on", "off", "no", and "yes" are YAML 1.1 booleans.
# Unquoted, PyYAML loads `- on` as True and the word is lost. Keep
# them quoted. test_ste.py fails on any non-string entry.
#
# DESIGN RULE, inherited from ``data/spelling/``: explicit word lists,
# never suffix rules. A rule such as "-s means verb" would misread
# "captures", "cases", and "series". Inflection is handled in code by
# testing whether the stem is in ``imperative_verbs``, so a word is only
# read as a verb when its base form is one we listed.

# Words that may stand between the start of an instruction and its
# verb. "Never raise the baseline" is an instruction; the adverb does
# not stop it being one. Kept apart from function_words because the
# role differs: these are read only in front of a verb, and several of
# them ("first", "please") are not function words at all.
adverbial_openers:
  - again
  - also
  - always
  - finally
  - first
  - instead
  - last
  - lastly
  - never
  - next
  - now
  - once
  - optionally
  - otherwise
  - please
  - second
  - then
  - third

