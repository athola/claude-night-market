phrases:
  vapid_openers:
    score: 4
    patterns:
      - "in today's fast-paced world"
      - "in an ever-evolving landscape"
      - "in the dynamic world of"
      - "in this digital age"
      - "as technology continues to evolve"
      - "in the realm of"
  empty_emphasis:
    score: 3
    patterns:
      - "cannot be overstated"
      - "goes without saying"
      - "needless to say"
      - "it bears mentioning"
      - "of paramount importance"
      - "absolutely essential"
  filler:
    score: 2
    patterns:
      - "it's worth noting that"
      - "it's important to understand"
      - "at its core"
      - "from a broader perspective"
      - "through this lens"
      - "when it comes to"
      - "at the end of the day"
sycophantic:
  score: 3
  patterns:
    - "I'd be happy to"
    - "Great question!"
    - "Absolutely!"
    - "That's a wonderful point"
    - "I'm glad you asked"
    - "You're absolutely right"
tier5:
  spatial_copula:
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\b(?:lives?|sits?|stands?|rests?|dwells?)\s+(?:in|at|on|between|within|atop)\b'
      - '\b(?:serves?\s+as|stands?\s+as|boasts?|nestled\s+in|rooted\s+in)\b'
  negative_parallelism:
    score: 3
    confidence: high
    ignore_case: true
    patterns:
      - '\bNot\s+just\s+\w+,?\s+but(?:\s+also)?\s+\w+'
      - '\bIt''s not [\w\s]+?,\s+it''s \w+'
      - '\bNo \w+\.\s+No \w+\.\s+Just \w+'
      - '\bNo \w+,\s+no \w+(?:,\s+no \w+)*'
      - '\bAnd that''s okay\.'
      # Copula-led trailing corrective: "It's X, not Y" / "This is X,
      # not Y". The opener marks a definitional statement, so this is
      # high-precision even mid-sentence and with articles before Y.
      - '\b(?:It''s|It is|This is|That''s|That is|These are|Those are)\s+[\w\s]+?,\s+not\b'
      # Bare trailing corrective: "Y, not X." Optional article before
      # the negated term catches "clear, not a gimmick." as well as
      # "clear, not clever." Genuine either/or choices are slop too;
      # rewrite as "Y instead of X".
      - '\b\w+,\s+not\s+(?:just\s+|a\s+|an\s+|the\s+)?\w+[.!?]'
  contrastive_parallelism:
    score: 2
    confidence: low
    ignore_case: false
    patterns:
      - '\b(?:Less|More)\s+\w+,\s+(?:less|more)\s+\w+'
      - '\bWhere\s+[\w\s]+?,\s+(?:we|you|they|it)\b'
  three_fragment_burst:
    score: 2
    confidence: high
    ignore_case: false
    patterns:
      - '\b([A-Z][a-z]+)\.\s+([A-Z][a-z]+)\.\s+([A-Z][a-z]+)\.'
  smart_quotes:
    score: 1
    confidence: high
    ignore_case: false
    patterns:
      - '[“”‘’]'
  plus_sign_conjunction:
    score: 1
    confidence: high
    ignore_case: false
    patterns:
      - '\w\s\+\s\w'
  arrow_connector:
    score: 1
    confidence: high
    ignore_case: false
    patterns:
      - '\s->\s|→'
  throat_clearing:
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\bHere''s the thing,'
      - '\bThe thing is,'
      - '\bLet that sink in\b'
      - '\bThe uncomfortable truth is\b'
