phrases:
  vapid_openers:
    score: 4
    patterns:
      - "in today's fast-paced world"
      - "in an ever-evolving landscape"
      - "in the dynamic world of"
      - "in this digital age"
      - "as technology continues to evolve"
      - "in the realm of"
  empty_emphasis:
    score: 3
    patterns:
      - "cannot be overstated"
      - "goes without saying"
      - "needless to say"
      - "it bears mentioning"
      - "of paramount importance"
      - "absolutely essential"
  filler:
    score: 2
    patterns:
      - "it's worth noting that"
      - "it's important to understand"
      - "at its core"
      - "from a broader perspective"
      - "through this lens"
      - "when it comes to"
      - "at the end of the day"
      - "shed light on"
  rlhf_hedge:
    # RLHF-safety hedges AI uses to soft-pedal a claim: "while it is
    # true that", "it could be argued that", "it's worth mentioning".
    score: 3
    patterns:
      - "while it is true that"
      - "while it's true that"
      - "it could be argued that"
      - "it's worth mentioning that"
      - "it's worth pointing out"
sycophantic:
  score: 3
  patterns:
    - "I'd be happy to"
    - "Great question!"
    - "Absolutely!"
    - "That's a wonderful point"
    - "I'm glad you asked"
    - "You're absolutely right"
tier5:
  spatial_copula:
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\b(?:lives?|sits?|stands?|rests?|dwells?)\s+(?:in|at|on|between|within|atop)\b'
      - '\b(?:serves?\s+as|stands?\s+as|boasts?|nestled\s+in|rooted\s+in)\b'
  negative_parallelism:
    score: 3
    confidence: high
    ignore_case: true
    patterns:
      - '\bNot\s+just\s+\w+,?\s+but(?:\s+also)?\s+\w+'
      - '\bIt''s not [\w\s]+?,\s+it''s \w+'
      - '\bNo \w+\.\s+No \w+\.\s+Just \w+'
      - '\bNo \w+,\s+no \w+(?:,\s+no \w+)*'
      - '\bAnd that''s okay\.'
      # Copula-led trailing corrective: "It's X, not Y" / "This is X,
      # not Y". The opener marks a definitional statement, so this is
      # high-precision even mid-sentence and with articles before Y.
      - '\b(?:It''s|It is|This is|That''s|That is|These are|Those are)\s+[\w\s]+?,\s+not\b'
      # Bare trailing corrective: "Y, not X." Optional article before
      # the negated term catches "clear, not a gimmick." as well as
      # "clear, not clever." Genuine either/or choices are slop too;
      # rewrite as "Y instead of X".
      - '\b\w+,\s+not\s+(?:just\s+|a\s+|an\s+|the\s+)?\w+[.!?]'
  litotes:
    # Double negation where a positive form exists: "not uncommon",
    # "not unlike", "never fails to". Two negations to say one positive
    # thing costs the reader a step and buys nothing, so unlike the
    # negation categories below this one is safe to rewrite rather than
    # merely surface.
    #
    # The stems are enumerated on purpose. A bare `not\s+(?:un|in)\w+`
    # fires on "not until", "not inside", "not intended" and "not
    # include", all of which are ordinary prose and all of which appear
    # throughout this repository.
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\bnot\s+un(?:common|like|usual|important|reasonable|clear|related|helpful|welcome|expected|aware|willing|able|necessary|fair|true|kind|familiar)\b'
      - '\bnot\s+in(?:significant|frequent|accurate|correct|considerable|expensive|valid|capable|conceivable|elegant)\b'
      - '\bnever\s+fails?\s+to\b'
      - '\bnot\s+without\s+(?:merit|precedent|risk|cost|value|some|its)\b'
  vacuous_negation:
    # Negation clichés that claim weight and supply none. Deleting the
    # phrase leaves the sentence saying exactly what it said before,
    # which is the test for filler. "cannot be overstated" is the
    # canonical one: it asserts importance in place of evidence.
    #
    # Distinct from negation that carries a fact ("the hook cannot
    # reach the registry"), which these patterns leave alone.
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\bcannot\s+be\s+over(?:stated|emphasi[sz]ed|estimated)\b'
      - '\bnot\s+to\s+be\s+(?:underestimated|overlooked|understated|missed)\b'
      - '\bit\s+goes\s+without\s+saying\b'
      - '\bneedless\s+to\s+say\b'
      - '\bno\s+small\s+(?:feat|task|thing|matter)\b'
      - '\bit(?:\s+is|''s)\s+not\s+hard\s+to\s+see\b'
  negative_definition:
    # Behavior described only by what it will not do: "the parser
    # doesn't handle nested blocks", "the exporter does not support
    # CSV". The positive form is usually shorter and always more
    # useful, because it tells the reader what to do next.
    #
    # Gated off by default, and low confidence when enabled, for the
    # same reason as anthropomorphism_low. Precise negation is how
    # contracts, invariants and trust boundaries are correctly
    # written, and this repository's rule files are built out of "do
    # not use for", "must not" and "never". A default-on version would
    # bury a real finding under hundreds of correct sentences.
    #
    # Enable it when auditing reference documentation, where negative
    # definition is a genuine tell, rather than on a routine sweep.
    # Surface every hit for a human to judge; never auto-rewrite.
    # Prohibitions ("must not", "do not"), invariants ("never gates")
    # and bare "cannot" carrying a fact are deliberately not matched.
    score: 1
    confidence: low
    ignore_case: true
    default_enabled: false
    patterns:
      - '\b(?:does\s+not|doesn''t)\s+(?:support|handle|accept|allow|provide|implement|cover|expose|understand|recogni[sz]e)\b'
      - '\b(?:is|are|was|were)\s+unable\s+to\b'
      - '\bfails?\s+to\s+(?:detect|handle|support|provide|recogni[sz]e|resolve|parse|account)\b'
      - '\bcannot\s+(?:handle|support|parse|resolve|represent|express|accommodate)\b'
  contrastive_parallelism:
    score: 2
    confidence: low
    ignore_case: false
    patterns:
      - '\b(?:Less|More)\s+\w+,\s+(?:less|more)\s+\w+'
      - '\bWhere\s+[\w\s]+?,\s+(?:we|you|they|it)\b'
  three_fragment_burst:
    score: 2
    confidence: high
    ignore_case: false
    patterns:
      - '\b([A-Z][a-z]+)\.\s+([A-Z][a-z]+)\.\s+([A-Z][a-z]+)\.'
  smart_quotes:
    score: 1
    confidence: high
    ignore_case: false
    patterns:
      - '[“”‘’]'
  plus_sign_conjunction:
    score: 1
    confidence: high
    ignore_case: false
    patterns:
      - '\w\s\+\s\w'
  arrow_connector:
    score: 1
    confidence: high
    ignore_case: false
    patterns:
      - '\s->\s|→'
  throat_clearing:
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\bHere''s the thing,'
      - '\bThe thing is,'
      - '\bLet that sink in\b'
      - '\bThe uncomfortable truth is\b'
      - '\blet(?:''s| me) dive (?:right )?in\b'
      - '\bpicture this\b'
      - '\bimagine (?:a world where|this)\b'
      - '\bin this (?:article|post|guide), we will\b'
      - '\bthis (?:article|post) aims to\b'
      - '\bhere''s what nobody tells you\b'
      - '\blet me explain\.'
      - '\bbear with me\.'
      - '\bthis matters because\b'
  semicolon_splice:
    # Prose semicolons read as a sophistication marker: a clause
    # spliced with a semicolon usually reads more naturally as two
    # sentences or one coordinating conjunction. Low confidence
    # because lists with internal commas need the semicolon, so this
    # surfaces every prose semicolon for human judgment instead of
    # auto-rewriting. Code and inline code are stripped before this
    # runs (see the markdown application layer). Policy: semicolons in
    # prose only when absolutely necessary.
    score: 1
    confidence: low
    ignore_case: false
    patterns:
      - '\w;\s+\w'
  performative_honesty:
    # "Honest X" headline framings and adverbial honesty throat-
    # clearing ("to be honest", "Honestly,", "full disclosure"):
    # manufactured authenticity. High confidence per the 2025-2026
    # update (aggressive mode). Scoped to framing nouns and
    # discourse-marker forms so ordinary uses like "an honest
    # mistake" pass. Dialogue and affiliate-SEO contexts carry
    # false-positive risk; disable via .slop-config.yaml there.
    score: 3
    confidence: high
    ignore_case: true
    patterns:
      - '\bto be honest[,.]?\b'
      - '\bin all honesty[,.]?\b'
      - '\btruth be told[,.]?\b'
      - '\bif i(?:''m| am) (?:being )?honest\b'
      - '\blet(?:''s| us) be honest\b'
      - '\bhonestly,'
      - '\bfull disclosure[,.]?\b'
      - '\ban honest (?:review|take|assessment|conversation|look)\b'
      - '\bthe honest truth about\b'
      - '\bmy honest (?:results|take|review|experience|opinion)\b'
      - '\bhonest take (?:on|about)\b'
      - '\breal talk:'
      - '\bhere''s the truth\b'
      - '\blet me be clear\b'
  sophistication_marker:
    # "prior art" and adjacent markers AI reaches for to sound
    # rigorous in non-academic prose: surveying prior art, standing
    # on the shoulders of, a body of work, state of the art. Bare
    # "prior art" is NOT matched, so legitimate patent and academic
    # uses pass. High confidence per the 2025-2026 update; IP-
    # adjacent repos can disable the category via .slop-config.yaml.
    score: 3
    confidence: high
    ignore_case: true
    patterns:
      - '\b(?:survey|surveying|surveys) (?:the )?prior art\b'
      - '\bbenefit from (?:the )?prior art\b'
      - '\bprior art in (?:this|the|our) (?:space|field|area|domain)\b'
      - '\b(?:stand|stands|standing) on (?:the )?shoulders of\b'
      - '\b(?:rich|extensive|vast|growing) body of (?:work|prior research|literature)\b'
      - '\bbuilding on (?:the )?(?:prior|existing|previous) work\b'
      - '\bstate of the art\b'
  participial_tail:
    # Comma-led present-participle fake-analysis tails: AI appends
    # ", highlighting", ", underscoring", ", paving the way for" to
    # manufacture analysis. Requires a leading comma so a sentence
    # that merely uses the word does not trip.
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - ',\s+highlighting\b'
      - ',\s+showcasing\b'
      - ',\s+underscoring\b'
      - ',\s+paving the way for\b'
      - ',\s+demonstrating\b'
      - ',\s+proving that\b'
      - ',\s+reinforcing\b'
      - ',\s+enabling\b'
  emphasis_crutch:
    # Manufactured-importance terminators: "Full stop.", "Make no
    # mistake", "Read that again." stamp authority or drama onto a
    # sentence.
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\bfull stop\.'
      - '\bmake no mistake\b'
      - '\bread that again\.?'
      - '\bmark my words\b'
  significance_cluster:
    # Manufactured historical weight. The surrounding facts carry
    # significance better than an assertion that they are significant.
    # Each pattern is anchored to the full collocation so literal uses
    # ("a last will and testament", "setting the stage lights") pass.
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\b(?:stands?|serves?)\s+as\s+a\s+testament\s+to\b'
      - '\bmarks?\s+a\s+turning\s+point\b'
      - '\bindelible\s+mark\b'
      - '\bdeeply\s+rooted\s+in\b'
      - '\bsetting\s+the\s+stage\s+for\b'
      - '\bshaping\s+the\s+future\s+of\b'
      - '\bunderscores?\s+the\s+importance\s+of\b'
      - '\bplays?\s+a\s+pivotal\s+role\b'
  loop_vocabulary:
    # Loop/cascade metaphors that read as insight while deferring the
    # claim: "unpack" for explain, "surface" for raise/report, "a quiet
    # shift" for the shift itself. Medium confidence because literal
    # senses are common in technical prose (unpacking a tuple, a
    # surface area), so these are surfaced for a human rather than
    # auto-rewritten.
    score: 1
    confidence: medium
    ignore_case: true
    patterns:
      # "unpack" as explain: only the metaphorical framings, so
      # "unpacks the tuple" and "unpack the archive" pass.
      - "\\b(?:let'?s|we'?ll|to|help(?:s)?\\s+(?:you|us))\\s+unpack\\s+(?:this|that|the|it)\\b"
      - '\ba\s+quiet\s+(?:shift|revolution|change)\b'
      - '\bthe\s+signal\s+here\s+is\b'
  anthropomorphism:
    # Issue #646. Human mental states, volition, and bodies attributed
    # to code, systems, and documents. Precision comes from requiring a
    # determiner plus a technical subject noun: "The parser understands"
    # fires, "She knows the codebase" and "Users understand" do not,
    # because a pronoun or a human role never precedes the verb.
    #
    # The subject list deliberately omits domain terms of art (observer,
    # listener, supervisor, daemon, orphan, zombie, heartbeat, replica)
    # so the anti-goal is enforced structurally rather than by a later
    # exclusion pass. It also omits human roles (reviewer, user,
    # developer, maintainer, author, team) so real people keep their
    # verbs, and "agent", which names an intentional system in this
    # codebase: "the agent tries to end its turn" is the accepted
    # description of a Stop hook, not a metaphor (corpus audit, #646).
    #
    # "expects" is intentionally absent. "The parser expects a closing
    # brace" is standard API prose, and no regex separates that from the
    # intent sense reliably enough for an auto-flag tier.
    score: 2
    confidence: high
    ignore_case: true
    patterns:
      - '\b(?:the|this|that|these|those|a|an|its|our|their)\s+(?:[a-z]+\s+){0,2}(?:scheduler|parser|lexer|module|package|cache|buffer|queue|pool|system|compiler|linter|formatter|resolver|router|client|server|allocator|handler|migration|gateway|adapter|wrapper|serializer|validator|encoder|decoder|transformer|loader|mapper|factory|controller|repository|store|storage|session|request|response|socket|stream|channel|payload|config|configuration|script|binary|library|framework|runtime|engine|kernel|driver|plugin|algorithm|function|method|class|struct|interface|api|endpoint|database|query|index|thread|process|worker|job|task|pipeline|build|container|hook|program|application|protocol|layer|backend|frontend|middleware|logger|tracer|profiler|generator|renderer|template|codebase|repo|branch|commit|test|suite|fixture|mock|harness|type\s+system|type\s+checker)s?\s+(?:knows?(?:\s+about)?|understands?|wants?\s+to|decides?|thinks?|believes?|remembers?|forgets?|learns?|cares?\s+about|tries?\s+to|is\s+happy\s+to|are\s+happy\s+to|is\s+aware\s+of|are\s+aware\s+of|agrees?|refuses?|is\s+smart\s+enough\s+to|are\s+smart\s+enough\s+to|reaches?\s+into|walks?\s+the|speaks?\s+to)\b'
  anthropomorphism_medium:
    # Issue #646 medium tier. Surface for human judgment; do not
    # auto-rewrite. Each pattern has a legitimate literal reading that
    # the subject guard is responsible for excluding.
    score: 2
    confidence: medium
    ignore_case: true
    patterns:
      # Metaphorical predicate nominative. Name what the thing does
      # instead: "is the seam" -> "translates between". The lookahead
      # requires the metaphor noun to close its phrase, so "is the
      # boundary distinction" and "is the seam alignment problem",
      # where the noun modifies a following noun, do not fire (corpus
      # audit, #646).
      - '\b(?:is|are|was|were|becomes?|became)\s+the\s+(?:seam|boundary|glue|bridge|backbone|heart|brain|nervous\s+system)\b(?=\s*(?:[.,;:!?)]|between|for|of|in|on|to|where|which|that|holding|linking|joining|connecting|$))'
      # "The config drives retry behavior" -> "controls" / "sets" /
      # "determines". The determiner-plus-noun guard keeps "He drives to
      # work" and "She drives the roadmap" out. "data-driven" and "data
      # driven" use the participle, so they never reach this pattern.
      - '\b(?:the|this|that|these|those|a|an|its|our|their)\s+(?:[a-z]+\s+){0,2}(?:config|configuration|setting|flag|schema|policy|value|parameter|option|environment|variable|file|field|column|table|model|spec|contract|interface|api|module|system|engine|layer|pipeline|framework|library|service|component|design|architecture|rule|constraint|threshold|metric|state|context|input|output|data|logic|code)s?\s+drives?\b'
      # "rides on top of" -> "runs on", "wraps", "uses".
      - '\b(?:the|this|that|these|those|a|an|its|our|their)\s+(?:[a-z]+\s+){0,2}(?:api|service|module|system|layer|client|server|scheduler|worker|engine|runtime|library|framework|protocol|driver|adapter|process|daemon|job)s?\s+rides?\s+(?:on\s+top\s+of|on|atop|over)\b'
      # Emphasis crutch in the "Full stop." family. Cut the modifier or
      # give the number that makes it real. The noun list is an explicit
      # allowlist so "a real number", "real time", "a real user", and
      # "real data" never fire. The lookbehinds drop the prepositional
      # sense, where "real work" means a non-synthetic workload set
      # against a test fixture ("run the gate on real work", "rather
      # than real work"). That is a literal distinction, not emphasis
      # (corpus audit, #646).
      - '(?<!on )(?<!for )(?<!than )(?<!with )(?<!against )\b(?:a\s+real|real)\s+(?:fix|fixes|work|solution|solutions|answer|answers|improvement|improvements|win|wins|difference|differences)\b'
  anthropomorphism_low:
    # Issue #646 low tier. Generalized agency verbs that are load-
    # bearing in systems prose: "the service handles retries" has no
    # concise non-anthropomorphic rewrite. Gated off by default via
    # default_enabled so a routine sweep never reports them; an opt-in
    # audit can still ask for them.
    #
    # default_enabled is a separate axis from confidence. The other
    # low-confidence categories (contrastive_parallelism,
    # semicolon_splice) are meant to be surfaced for human judgment and
    # keep firing by default.
    score: 1
    confidence: low
    default_enabled: false
    ignore_case: true
    patterns:
      - '\b(?:the|this|that|these|those|a|an|its|our|their)\s+(?:[a-z]+\s+){0,2}[a-z]+\s+(?:handles?|manages?|owns?|talks?\s+to|sees?)\b'

# ---------------------------------------------------------------------
# ASD-STE100-derived rules that are regex properties.
#
# SCOPE. The three canonical STE structural checks (sentence length,
# paragraph length, noun clusters) are NOT regex properties: they need
# word-count normalization, sentence segmentation, and noun detection.
# Those live in ``scribe.ste`` and are tested in ``test_ste.py``. Only
# the four rules below can be expressed here, and putting them here
# rather than in a skill file is what makes them portable to any repo
# that loads this pack.
#
# GATED OFF. Every category sets ``default_enabled: false``. STE is a
# register for operator-facing and procedural text, not a house style
# for all prose, and a default-on sweep would report on nearly every
# file in a normal repository. Callers opt in with
# ``get_ste_patterns(patterns, include_optional=True)``.
#
# CITATION. Rule 8.1 is the one rule number this project cites, because
# it is the one verifiable in public sources. The other three
# categories are cited by content, not by number. The controlled
# dictionary is copyright ASD and is not reproduced anywhere here, so
# vocabulary checking is out of scope.
#
# MASK CODE FIRST. These regexes assume the caller has already removed
# fenced code, inline code, and URLs. A semicolon in a shell snippet is
# not prose.
ste:
  semicolons:
    # Rule 8.1: the semicolon is not permitted. Stricter than the house
    # ``semicolon_splice`` category, which keeps a semicolon when a
    # list's items carry internal commas. STE keeps none.
    score: 2
    confidence: high
    default_enabled: false
    ignore_case: false
    patterns:
      - '\S;(?:\s|$)'

  banned_tenses:
    # STE permits the simple tenses, the infinitive, the imperative,
    # and the past participle used as an adjective. The perfect and
    # continuous forms are not approved.
    score: 2
    confidence: medium
    default_enabled: false
    ignore_case: true
    patterns:
      # Present and past perfect: "has finished", "had been removed".
      - '\b(?:have|has|had)\s+(?:been\s+|already\s+|not\s+)*[a-z]+(?:ed|en|ne|un|it)\b'
      # Continuous: "is running", "was being checked".
      - '\b(?:am|is|are|was|were|be|been|being)\s+(?:not\s+)?[a-z]+ing\b'

  contractions:
    # STE spells the words out. "Do not", never "don't".
    score: 1
    confidence: high
    default_enabled: false
    ignore_case: true
    patterns:
      # n't forms: don't, won't, cannot-contracted, isn't.
      - "\\b[a-z]+n't\\b"
      # Pronoun and demonstrative contractions: it's, we'll, they've.
      - "\\b(?:i|you|we|they|he|she|it|that|there|here|what|who)'(?:s|re|ll|ve|d|m)\\b"

  passive_voice:
    # STE requires the active voice in procedures. Reported at warning
    # level because the passive is legitimate in descriptive text when
    # the actor is genuinely unknown or irrelevant.
    score: 1
    confidence: low
    default_enabled: false
    ignore_case: true
    patterns:
      # Passive with a named agent: "was executed by the daemon".
      - '\b(?:am|is|are|was|were|be|been|being)\s+[a-z]+(?:ed|en)\s+by\b'
      # Agentless passive: "is removed", "were checked".
      - '\b(?:am|is|are|was|were)\s+(?:not\s+)?[a-z]+(?:ed|en)\b(?!\s+by\b)'
