[tool.nightmarket]
coverage_threshold = 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spec-kit"
version = "1.9.20"
description = "Spec Driven Development toolkit with enhanced superpowers integration (synced with upstream spec-kit v0.5.0)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Claude Skills", email = "claude@anthropic.com"},
]
keywords = ["speckit", "spec-driven-development", "specification", "planning", "implementation", "workflow", "tdd", "requirements"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
dev = [
    # Development tools
    "ruff>=0.14.13",                    # Linting and formatting
    "mypy>=1.18.2,<2",                     # Type checking
    "pre-commit>=4.0.0",                # Git hooks

    # Testing
    "pytest>=8.0",
    "pytest-cov>=6.0.0",

    # Advanced testing
    "pytest-xdist>=3.6.1",                # Parallel testing
    "pytest-benchmark>=4.0.0,<6.0.0",   # Performance testing

    # Security scanning
    "bandit>=1.7.9,<2.0.0",             # Security vulnerability scanner
]

[project.urls]
Homepage = "https://github.com/github/spec-kit"
Documentation = "https://spec-kit.readthedocs.io"
Repository = "https://github.com/github/spec-kit"
"Bug Tracker" = "https://github.com/github/spec-kit/issues"
Changelog = "https://github.com/github/spec-kit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/commands",
    "/skills",
    "/agents",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/speckit"]

# Ruff configuration
[tool.ruff]
# Inherit the repo-wide rule floor; this file may only add.
extend = "../../pyproject.toml"
target-version = "py39"
line-length = 88

[tool.ruff.lint]
extend-ignore = ["S101"]
extend-select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "PLR0913", # too-many-arguments (enforced ecosystem-wide, not ignored)
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011", "S101", "PLR2004", "D102", "D103", "S108", "D205"]
"scripts/**/*.py" = ["S603", "T201"]

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["speckit.caching"]
disable_error_code = ["return-value"]

# Pytest configuration
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/speckit",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
    "security: marks tests as security-related tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/speckit"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2",
    "ruff>=0.14.13",
    "pytest>=8.0",
    "pytest-cov>=6.0.0",
]
