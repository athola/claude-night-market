[project]
name = "phantom"
version = "1.9.18"
description = "Computer use toolkit for Claude - screenshot capture, mouse/keyboard control, and agent loop"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Thola", email = "alex@thola.dev" }]
dependencies = [
    "anthropic>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0,<2",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.nightmarket]
coverage_threshold = 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phantom"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLR0913"]
ignore = ["UP017", "UP007"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["_pytest.*", "pytest.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["anyio", "anyio.*"]
ignore_missing_imports = true
# anyio's own source uses `match` statements (3.10+). Targeting the 3.9 floor,
# mypy cannot parse them and errors inside site-packages rather than on our
# code. We never type against anyio, so keep it opaque.
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --cov=phantom --cov-report=term-missing"

[tool.coverage.run]
source = ["src/phantom"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "src/phantom/__main__.py",
    "src/phantom/cli.py",
    "src/phantom/loop.py",
    "src/phantom/display.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
