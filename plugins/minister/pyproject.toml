[project]
name = "minister"
version = "1.9.17"
description = "GitHub-centric project management plugin for Claude Code"
authors = [{name = "Claude Night Market"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "mypy>=1.11.0",
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.optional-dependencies]
github = [
    "pygithub>=2.4.0",
    "requests>=2.32.0",
]

[tool.nightmarket]
coverage_threshold = 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minister"]

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "PL", "D"]
extend-ignore = [
    "S101",   # Use of assert (acceptable)
    "E203",
    "D203",
    "D213",
    "D107",
    "S603",
    "S607",
    "E501",   # Line too long (handled by formatter); matches root config
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",  # Magic values in test assertions are acceptable
    "S311",     # Allow pseudo-random generators in tests
]
"scripts/tracker.py" = [
    "E402",  # sys.path bootstrap must run before the deferred import
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=minister --cov-report=term-missing"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/minister"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
