# Memory Palace Hook Configuration
# Privacy-preserving defaults: local cache only, no automatic capture, and no
# telemetry. Operators may opt in explicitly for a particular installation.

enabled: true
research_mode: cache_only

local_knowledge_paths:
  - "docs/"
  - "references/"
  - "wiki/"

exclude_patterns:
  - ".git/"
  - ".gitignore"
  - ".gitattributes"
  - ".gitmodules"
  - "node_modules/"
  - "__pycache__/"
  - ".venv/"
  - "venv/"
  - ".uv-cache/"
  - "dist/"
  - "build/"
  - "target/"
  - "*.egg-info/"
  - ".vscode/"
  - ".idea/"
  - "*.swp"
  - "*.swo"
  - ".DS_Store"
  - ".pytest_cache/"
  - ".coverage"
  - "htmlcov/"
  - ".tox/"
  - "*.lock"
  - "package-lock.json"
  - "yarn.lock"
  - "uv.lock"
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "credentials.*"
  - "secrets.*"
  - "_build/"
  - "site/"
  - ".docusaurus/"
  - "*.log"
  - "tmp/"
  - "temp/"

respect_gitignore: true

safety:
  max_content_size_kb: 500
  max_line_length: 10000
  max_lines: 50000
  detect_repetition_bombs: true
  repetition_threshold: 0.95
  detect_unicode_bombs: true
  max_combining_chars: 10
  block_bidi_override: true
  parsing_timeout_ms: 5000

index_file: "memory-palace-index.yaml"
indexes_dir: "data/indexes"
corpus_dir: "data/wiki"
embedding_provider: "none"

autonomy_level: 0
intake_threshold: 70
domains_of_interest: []
tending_frequency: "weekly"

telemetry:
  enabled: false
  file: "data/telemetry/memory-palace.csv"

feature_flags:
  cache_intercept: true
  autonomy: false
  lifecycle: false
  auto_capture: false
  context_injection: false
