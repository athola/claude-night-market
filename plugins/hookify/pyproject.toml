[project]
name = "hookify"
version = "1.9.20"
description = "Hook generation and pattern matching utilities for Claude Code"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.18.2,<2",
    "ruff>=0.14.13",
    "types-pyyaml>=6.0.12",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "__pycache__",
]

[tool.ruff]
# Inherit the repo-wide rule floor; this file may only add.
extend = "../../pyproject.toml"
target-version = "py39"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "UP", "B", "C4", "PLR0913"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=core --cov-report=term-missing"

[tool.coverage.run]
source = ["core"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.nightmarket]
coverage_threshold = 90
