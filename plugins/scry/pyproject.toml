[project]
name = "scry"
version = "1.9.20"
description = "Media generation capabilities for terminal recordings (VHS), browser recordings (Playwright), GIF processing, and media composition"
authors = [{name = "Alex Thola", email = "alexthola@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.18.2,<2",
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]

# Note: scry has no Python source code (only shell scripts and tests).
# Coverage is not applicable - tests validate plugin structure and workflows.
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require ffmpeg/vhs)",
    "slow: Slow running tests",
    "bdd: BDD-style tests with Given/When/Then",
    "requires_vhs: mark test as requiring vhs to be installed",
    "requires_ffmpeg: mark test as requiring ffmpeg to be installed",
    "requires_playwright: mark test as requiring playwright to be installed",
]

[tool.ruff]
# Inherit the repo-wide rule floor; this file may only add.
extend = "../../pyproject.toml"
line-length = 88
target-version = "py39"

[tool.ruff.lint]
extend-select = ["E", "W", "F", "I", "B", "C4", "PLR0913"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Relax strictness for test files.
# tests/ has no __init__.py, so mypy names these modules `test_foo` and
# `conftest`, not `tests.test_foo`. The bare `tests.*` pattern never matched
# anything, which left every relaxation below dead until the bare-name
# patterns were added.
[[tool.mypy.overrides]]
module = ["tests.*", "test_*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["_pytest.*", "pytest.*"]
ignore_missing_imports = true
# pytest's own source uses `match` statements (3.10+). Targeting the 3.9 floor,
# mypy cannot parse them and errors inside site-packages rather than on our
# code. Mirrors the same override in plugins/phantom/pyproject.toml.
follow_imports = "skip"
follow_imports_for_stubs = true
