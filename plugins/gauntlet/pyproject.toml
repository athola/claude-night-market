[tool.nightmarket]
coverage_threshold = 85

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gauntlet-dev"
version = "1.9.18"
description = "Codebase learning through knowledge extraction, challenges, and spaced repetition"
authors = [
    {name = "Alex Thola", email = "alexthola@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "tree-sitter>=0.23,<1",
    "tree-sitter-language-pack>=0.3,<2",
    "networkx>=3.2,<4",
]

[project.optional-dependencies]
graph = [
    "igraph>=0.11,<2",
]
dev = [
    "ruff>=0.14.13",
    "mypy>=1.11.0,<2",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.ruff]
# Inherit the repo-wide rule floor; this file may only add.
extend = "../../pyproject.toml"
line-length = 88
target-version = "py39"
exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
extend-select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "PL", "D"]
# E501 aligns with the root workspace config: line length is handled by
# `ruff format`, not the linter.
extend-ignore = ["S101", "E203", "D203", "D213", "UP017", "E501"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101", "S108", "PLR2004", "D102", "D103", "D205", "D400",
    "D415", "D212", "S603", "S607", "PLW1510",
]
"scripts/**/*.py" = ["S603", "S607", "PLR0911", "PLR2004", "UP045", "S105"]
"hooks/**/*.py" = ["S603", "S607", "PLR0911", "PLR2004", "UP045", "S105", "PLC0415", "BLE001", "E402"]
# git subprocess calls here use a fixed argv list (no shell=True) built
# from a regex-validated ref; the partial "git" path is the standard,
# PATH-resolved invocation used throughout this repo's tooling.
"src/gauntlet/blast_radius.py" = ["S603", "S607"]
"src/gauntlet/incremental.py" = ["S603", "S607"]
# Both queries below interpolate only a `?, ?, ...` placeholder string
# built from a chunk length; the actual values are always bound as
# parameters, never concatenated into the SQL text.
"src/gauntlet/graph.py" = ["S608"]
# random.choices() here weights which challenge/knowledge entry to show
# next for spaced repetition; it is gameplay selection, not a security
# or cryptographic use of randomness.
"src/gauntlet/challenges.py" = ["S311"]
"src/gauntlet/progress.py" = ["S311"]
# "PASS" is a ChallengeResult enum member (grading outcome), not a
# credential; the string "pass" only coincidentally matches the
# password-heuristic ruff uses for S105.
"src/gauntlet/models.py" = ["S105"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anyio", "anyio.*"]
ignore_missing_imports = true
# anyio's own source uses `match` statements (3.10+). Targeting the 3.9 floor,
# mypy cannot parse them and errors inside site-packages rather than on our
# code. We never type against anyio, so keep it opaque.
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "scripts", "hooks"]
addopts = "-v --cov=src/gauntlet --cov-report=term-missing"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["src/gauntlet"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0,<2",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.14.13",
    "types-pyyaml>=6.0.12.20250915",
]
