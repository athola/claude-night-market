repos:
  - repo: local
    hooks:
      # =================================================================
      # Lint Suppression Guard - Must run before ruff
      # =================================================================

      - id: check-noqa
        name: Block Inline Lint Suppressions
        entry: python3 scripts/check_noqa.py
        language: system
        types: [python]
        exclude: (scripts/check_noqa\.py|tests/.*test_.*noqa|tests/.*test_.*guard|plugins/.*/tests/.*test_.*noqa|plugins/.*/tests/.*test_.*guard)
        stages: [pre-commit]

      # =================================================================
      # Docstring Quality - Block name-restating docstrings
      # =================================================================

      - id: check-docstring-quality
        name: Block Restating Docstrings
        entry: python3 scripts/check_docstring_quality.py
        language: system
        types: [python]
        exclude: (scripts/check_docstring_quality\.py|tests/.*test_check_docstring_quality)
        stages: [pre-commit]

      # =================================================================
      # JSON Utilities Drift Check - Keep inlined copies in sync
      # =================================================================

      - id: check-json-utils-drift
        name: Verify Inlined JSON Utilities Match Canonical
        entry: bash scripts/shared/check-json-utils-drift.sh
        language: system
        files: (scripts/shared/json_utils\.sh|plugins/(imbue|conserve)/hooks/session-start\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      # =================================================================
      # Per-File-Ignores Guard - Block config-level suppression creep
      # =================================================================

      - id: check-per-file-ignores
        name: Block New Per-File-Ignores
        entry: python3 scripts/check_per_file_ignores.py
        language: system
        files: pyproject\.toml$
        stages: [pre-commit]

      # =================================================================
      # Hook Registration Check
      # =================================================================

      - id: check-hook-registrations
        name: Verify Hook Registrations
        entry: python3 plugins/sanctum/scripts/update_plugin_registrations.py --dry-run
        language: system
        files: ^plugins/.*/(hooks/|\.claude-plugin/plugin\.json)
        pass_filenames: false
        stages: [pre-commit]

      # =================================================================
      # Duplicate Hooks Guard - Block auto-loaded hooks in manifests
      # =================================================================

      - id: check-plugin-hooks
        name: Block Duplicate hooks/hooks.json
        entry: python3 scripts/check_plugin_hooks.py
        language: system
        files: \.claude-plugin/plugin\.json$
        stages: [pre-commit]

      # =================================================================
      # Code Quality Hooks - Run for changed plugins
      # Note: Linting handled by global ruff-format + ruff hooks below
      # =================================================================

      # Note: These hooks use pass_filenames: false because the scripts
      # determine changed files via 'git diff --cached' internally.
      # The 'files:' pattern only controls WHEN the hook triggers.
      - id: run-plugin-typecheck
        name: Type Check All Plugins (strict)
        entry: ./scripts/run-plugin-typecheck.sh --all
        language: system
        pass_filenames: false  # Script checks every plugin internally
        stages: [pre-commit]
        # pyproject.toml as well as .py. A plugin's pyproject is what decides
        # whether mypy exists in its environment and which config it runs
        # under, so a pyproject-only commit changes the outcome of this very
        # hook. Adding plugins/cartograph/pyproject.toml touched no .py file,
        # this hook never fired, and the typecheck broke in CI instead. The
        # typecheck.yml gate already watches plugins/**/pyproject.toml; this
        # is pre-commit catching up to it.
        files: ^plugins/.*(\.py|/pyproject\.toml)$
        verbose: true

      - id: run-plugin-tests
        name: Test Changed Plugins
        entry: ./scripts/run-plugin-tests.sh --changed
        language: system
        pass_filenames: false  # Script uses git diff internally
        stages: [pre-commit]
        files: ^plugins/.*\.(py|md)$  # Triggers on .py/.md changes
        verbose: true

      # =================================================================
      # Plugin Validation Hooks
      # =================================================================

      - id: validate-skill-descriptions
        name: Validate Skill Descriptions
        entry: python3 scripts/fix_descriptions.py --check
        language: system
        files: SKILL\.md$
        pass_filenames: false

      - id: validate-abstract-skills
        name: Validate Abstract Skills
        entry: python3 plugins/abstract/scripts/abstract_validator.py
        language: system
        files: ^plugins/abstract/.*SKILL\.md$
        pass_filenames: false
        args: ["--root", "plugins/abstract", "--scan"]

      - id: validate-imbue-skills
        name: Validate Imbue Skills
        entry: python3 plugins/imbue/scripts/imbue_validator.py
        language: system
        files: ^plugins/imbue/.*SKILL\.md$
        pass_filenames: false
        args: ["--root", "plugins/imbue", "--scan"]

      - id: validate-abstract-plugin
        name: Validate Abstract Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/abstract
        language: system
        files: ^plugins/abstract/
        pass_filenames: false

      - id: validate-imbue-plugin
        name: Validate Imbue Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/imbue
        language: system
        files: ^plugins/imbue/
        pass_filenames: false

      - id: validate-archetypes-plugin
        name: Validate Archetypes Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/archetypes
        language: system
        files: ^plugins/archetypes/
        pass_filenames: false

      - id: validate-conjure-plugin
        name: Validate Conjure Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/conjure
        language: system
        files: ^plugins/conjure/
        pass_filenames: false

      - id: validate-conserve-plugin
        name: Validate Conserve Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/conserve
        language: system
        files: ^plugins/conserve/
        pass_filenames: false

      - id: validate-attune-plugin
        name: Validate Attune Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/attune
        language: system
        files: ^plugins/attune/
        pass_filenames: false

      - id: validate-memory-palace-plugin
        name: Validate Memory Palace Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/memory-palace
        language: system
        files: ^plugins/memory-palace/
        pass_filenames: false

      - id: validate-egregore-plugin
        name: Validate Egregore Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/egregore
        language: system
        files: ^plugins/egregore/
        pass_filenames: false

      - id: validate-hookify-plugin
        name: Validate Hookify Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/hookify
        language: system
        files: ^plugins/hookify/
        pass_filenames: false

      - id: validate-leyline-plugin
        name: Validate Leyline Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/leyline
        language: system
        files: ^plugins/leyline/
        pass_filenames: false

      - id: validate-minister-plugin
        name: Validate Minister Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/minister
        language: system
        files: ^plugins/minister/
        pass_filenames: false

      - id: validate-parseltongue-plugin
        name: Validate Parseltongue Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/parseltongue
        language: system
        files: ^plugins/parseltongue/
        pass_filenames: false

      - id: validate-pensive-plugin
        name: Validate Pensive Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/pensive
        language: system
        files: ^plugins/pensive/
        pass_filenames: false

      - id: validate-phantom-plugin
        name: Validate Phantom Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/phantom
        language: system
        files: ^plugins/phantom/
        pass_filenames: false

      - id: validate-sanctum-plugin
        name: Validate Sanctum Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/sanctum
        language: system
        files: ^plugins/sanctum/
        pass_filenames: false

      - id: validate-scribe-plugin
        name: Validate Scribe Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/scribe
        language: system
        files: ^plugins/scribe/
        pass_filenames: false

      - id: validate-scry-plugin
        name: Validate Scry Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/scry
        language: system
        files: ^plugins/scry/
        pass_filenames: false

      - id: validate-spec-kit-plugin
        name: Validate Spec-Kit Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/spec-kit
        language: system
        files: ^plugins/spec-kit/
        pass_filenames: false

      - id: validate-tome-plugin
        name: Validate Tome Plugin Structure
        entry: python3 plugins/abstract/scripts/validate_plugin.py plugins/tome
        language: system
        files: ^plugins/tome/
        pass_filenames: false

      - id: validate-knowledge-corpus
        name: Validate Knowledge Corpus Frontmatter
        entry: python3 plugins/memory-palace/scripts/validate_knowledge_corpus.py
        language: system
        files: ^plugins/memory-palace/docs/knowledge-corpus/.*\.md$
        pass_filenames: false

      - id: meta-evaluation-check
        name: Meta-Evaluation Quality Check
        entry: python3 plugins/sanctum/scripts/update_plugin_registrations.py --dry-run
        language: system
        files: ^plugins/.*/skills/.*SKILL\.md$
        pass_filenames: false
        verbose: true

      - id: check-context-optimization
        name: Check Context Optimization
        entry: python3 plugins/abstract/scripts/context_optimizer.py stats plugins/
        language: system
        files: ^.*SKILL\.md$
        pass_filenames: false

      - id: validate-description-budget
        name: Validate Description Budget
        entry: python3 plugins/abstract/scripts/validate_budget.py
        language: system
        files: ^plugins/.*(SKILL\.md|commands/.*\.md)$
        pass_filenames: false

      - id: check-markdown-links
        name: Check Markdown Links
        entry: python3 scripts/check-markdown-links.py
        language: system
        files: \.md$
        pass_filenames: true
        stages: [pre-commit]

      - id: capabilities-sync-check
        name: Capabilities Sync Check
        entry: bash scripts/capabilities-sync-check.sh
        language: system
        files: ^(plugins/.*(plugin\.json|openpackage\.yml|SKILL\.md|commands/.*\.md|agents/.*\.md)|book/src/reference/capabilities-reference\.md)$
        pass_filenames: false
        stages: [pre-commit]

      # =================================================================
      # Memory-Palace Self-Curation
      # Burst-tolerant maintenance cycles, re-stages changed artifacts:
      #   - capture-index drain (promote + prune-orphans): idempotent
      #   - vitality refresh (decay by elapsed days, not per-run)
      # Sub-second when there is nothing to do.
      # =================================================================

      - id: memory-palace-maintenance
        name: Memory-Palace Self-Curation (drain + vitality)
        entry: bash plugins/memory-palace/scripts/precommit_palace_maintenance.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # =================================================================
      # Skill-Graph Dangling-Ref Ratchet
      # Fails only when broken Skill(plugin:name) refs exceed the
      # committed baseline. Deterministic, idempotent, read-only.
      # =================================================================

      - id: check-skill-graph-drift
        name: Block New Dangling Skill References
        entry: python3 scripts/check_skill_graph_drift.py
        language: system
        files: SKILL\.md$
        pass_filenames: false
        stages: [pre-commit]

      # =================================================================
      # Skill Exit-Criteria Coverage Ratchet
      # Fails only when SKILL.md files lacking an "## Exit Criteria"
      # section exceed the committed baseline (issue #454).
      # Deterministic, idempotent, read-only.
      # =================================================================

      - id: check-skill-exit-criteria-drift
        name: Block New Skills Without Exit Criteria
        entry: python3 scripts/check_skill_exit_criteria_drift.py
        language: system
        files: SKILL\.md$
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: requirements-txt-fixer

  - repo: https://github.com/pycqa/bandit
    # 1.8.6 is the last release supporting Python 3.9 (1.9.0+ require
    # >=3.10); the system interpreter here is 3.9.6. Pin the hook env
    # too so pip does not pull a 3.10-only bandit into the venv.
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "plugins/"]
        # The pinned rev controls the bandit version; this only adds the
        # `toml` extra (tomli) so bandit can read pyproject.toml config.
        # Re-requesting bandit[toml] here would conflict with the cloned
        # hook repo's own bandit install.
        additional_dependencies: ["tomli"]
        exclude: \.venv/|\.uv-cache/|__pycache__/|node_modules/|\.egg-info/

  # =================================================================
  # Global Code Quality (Fast - Runs on All Files)
  # =================================================================

  # Ruff via the project's own uv-managed ruff (pinned in uv.lock) so the
  # hook and `uv run ruff` / `make format` share one version and cannot
  # diverge. --config pyproject.toml forces the root config (no per-plugin
  # discovery), matching the prior ruff-pre-commit mirror behavior.
  - repo: local
    hooks:
      # 1. Format
      - id: ruff-format
        name: Ruff - Format
        entry: uv run ruff format --config pyproject.toml
        language: system
        types: [python]
      # 2. Fix auto-fixable lint issues
      - id: ruff-fix
        name: Ruff - Fix
        entry: uv run ruff check --fix --config pyproject.toml
        language: system
        types: [python]
      # 3. Verify no remaining lint issues
      - id: ruff-check
        name: Ruff - Check
        entry: uv run ruff check --config pyproject.toml
        language: system
        types: [python]
      # 4. Flag when the locked ruff lags the latest PyPI release
      #    (advisory; runs only on dependency-file changes so ordinary
      #    commits pay no network cost; skips cleanly when offline).
      - id: check-ruff-version
        name: Ruff Version Check
        entry: python3 scripts/check_ruff_version.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      # 5. Block when pinned CI actions or external pre-commit hooks lag
      #    upstream (blocking; runs only on CI / pre-commit config changes
      #    so ordinary commits pay no network cost; skips cleanly offline).
      - id: check-pinned-versions
        name: CI / Pre-commit Version Check
        entry: python3 scripts/check_pinned_versions.py
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/.*\.ya?ml)$

  # Strict type checking is handled by the local `run-plugin-typecheck`
  # hook above (and the typecheck.yml CI gate), which runs each plugin's
  # own strict mypy config inside its uv environment. A single global
  # mypy hook cannot type-check this src-layout monorepo: running mypy
  # from the root collides on duplicate module names (e.g. abstract.utils
  # resolves as both plugins.abstract.src.abstract.utils and
  # abstract.utils). The previous global hook worked around this by
  # disabling ~13 error codes, which silently let real type errors
  # through. Per-plugin strict checking is the authoritative gate.

# =================================================================
# CI Configuration
# =================================================================
ci:
  skip: [run-plugin-typecheck, run-plugin-tests, memory-palace-maintenance]

default_stages: [pre-commit]
default_language_version:
  python: python3
default_install_hook_types: [pre-commit, pre-push, pre-merge-commit]
minimum_pre_commit_version: 2.9.0
