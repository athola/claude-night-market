name: Python 3.9 Hook Compatibility (issue #204)

# Validates that hook scripts from all hook-registering plugins
# remain importable and testable under Python 3.9 (the minimum
# version required for system Python support).
#
# Plugins covered: every plugins/*/hooks directory. The trigger and the
# ruff step use globs, so a new plugin is covered without an edit here.
# The pytest matrix is listed by hand because each plugin names its own
# hook test subset; tests/test_ci_hand_kept_lists.py keeps it honest.
#
# Two gates per plugin:
#   1. ruff FA102: flags `X | Y` union annotations in modules that lack
#      `from __future__ import annotations`, which raise TypeError at
#      import time on Python 3.9.
#   2. pytest hooks: runs only the tests that exercise hook
#      scripts under CPython 3.9.
#   3. hook imports: imports every registered hook under CPython 3.9.
#      Hooks import plugin `src/` packages, and the whole transitive
#      chain has to stay 3.9-compatible, so `src/**` triggers this too.

on:
  push:
    branches: [main, master]
    paths:
      - "plugins/*/hooks/**"
      - "plugins/*/src/**"
      - ".github/workflows/python39-compat.yml"
  pull_request:
    paths:
      - "plugins/*/hooks/**"
      - "plugins/*/src/**"
      - ".github/workflows/python39-compat.yml"
  workflow_dispatch:

concurrency:
  group: python39-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Gate 1: Static syntax check                                          #
  # Ruff FA102 detects `X | Y` union annotations on files that lack     #
  # `from __future__ import annotations`, which would raise a           #
  # TypeError at import time on Python 3.9.                             #
  # ------------------------------------------------------------------ #
  syntax-check:
    name: ruff FA102 union annotation syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install ruff
        run: uv tool install ruff

      - name: Check hook files for 3.10+ union syntax (FA102)
        # FA102 flags a PEP 604 union in a module targeting py39 without the
        # future import. UP007 cannot stand in for it: UP007 rewrites
        # Optional[X] into X | Y and exits 0 on `int | None` at py39.
        # The glob expands to every plugin's hooks directory; ruff accepts
        # a directory that holds no Python files.
        run: |
          ruff check \
            --select FA102 \
            --target-version py39 \
            plugins/*/hooks/

  # ------------------------------------------------------------------ #
  # Gate 2: Runtime hook tests under Python 3.9                         #
  # Each plugin runs only its hooks test subtree so the job stays        #
  # focused on what matters: hook script importability and behaviour.    #
  # ------------------------------------------------------------------ #
  hook-tests:
    name: pytest hooks ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: abstract
            hook_test_path: tests/hooks
          - plugin: cartograph
            hook_test_path: tests/unit/test_graph_community_refresh.py
          - plugin: conserve
            hook_test_path: tests/unit/test_context_warning.py tests/unit/test_permission_request.py
          - plugin: egregore
            hook_test_path: tests/test_session_start_hook.py
          - plugin: gauntlet
            hook_test_path: tests/unit/test_graph_auto_update.py tests/unit/test_precommit.py
          - plugin: herald
            hook_test_path: tests/unit/test_double_shot_latte.py
          - plugin: hookify
            hook_test_path: tests/test_rule_guard_hook.py
          - plugin: imbue
            hook_test_path: tests/unit/hooks
          - plugin: leyline
            hook_test_path: tests/hooks
          - plugin: memory-palace
            hook_test_path: tests/hooks
          - plugin: oracle
            hook_test_path: tests/unit/test_daemon_lifecycle.py
          - plugin: pensive
            hook_test_path: tests/unit/test_pr_blast_radius.py
          - plugin: sanctum
            hook_test_path: tests/hooks
          - plugin: tome
            hook_test_path: tests/unit/test_pre_compact.py tests/unit/test_session_start.py tests/unit/test__session_utils.py

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Hook scripts use only stdlib; we install pytest in an
      # isolated venv to avoid the plugin's requires-python
      # constraint (most plugins target >=3.12 for their main
      # code, but hooks must run under system Python 3.9).
      # PyYAML is included because abstract's hook-adjacent script
      # ``aggregate_skill_logs.py`` imports ``abstract.utils``, which
      # transitively loads ``abstract/__init__.py`` ->
      # ``frontmatter.py`` -> ``yaml``. Adding it unconditionally
      # is cheaper than per-matrix branching and does not affect
      # other plugins (their hook tests do not import yaml).
      - name: Create Python 3.9 venv with pytest
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          uv venv --python 3.9
          uv pip install pytest pyyaml

      - name: Run hook tests under Python 3.9
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          .venv/bin/python -m pytest ${{ matrix.hook_test_path }} \
            -v --tb=short \
            --override-ini="addopts="

  # ------------------------------------------------------------------ #
  # Gate 3: every registered hook imports under Python 3.9              #
  # The root gate imports each hook in a subprocess of the interpreter   #
  # running pytest, so running it on 3.9 checks the 3.9 import chain.    #
  # ------------------------------------------------------------------ #
  hook-imports:
    name: hook imports under 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.9
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Import every registered hook under Python 3.9
        run: |
          uv run --python 3.9 --no-project --with pytest \
            python -m pytest tests/test_hooks_import_without_project_deps.py \
            -q --tb=short --override-ini="addopts="
