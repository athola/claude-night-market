name: Slop Check

on:
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/slop-check.yml'

jobs:
  slop-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # The scan used to be an inline TIER1=/TIER2= grep alternation.
      # plugins/scribe/data/languages/en.yaml is the single pattern
      # source the slop-detector skill loads at runtime, so the gate was
      # enforcing a snapshot of it: every Tier 5 category added since was
      # invisible here, and a regex category cannot be written as a word
      # alternation at all. scripts/slop_score.py reads the YAML, so a
      # category added there reaches CI with no edit to this file.
      - name: Scan docs for slop markers
        id: scan
        run: |
          set -o pipefail
          uv run --with pyyaml python scripts/slop_score.py \
            --threshold 3.0 docs book/src | tee scan.txt

      - name: Publish scan summary
        if: always()
        run: |
          {
            printf '### Slop check\n\n```\n'
            cat scan.txt 2>/dev/null || printf 'scan did not run\n'
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment on PR if threshold exceeded
        if: failure() && steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$(printf \
            '**Slop check failed** (threshold: 3.0)\n\n```\n%s\n```\n\nPatterns come from `plugins/scribe/data/languages/en.yaml`. See slop-detector `structural-patterns.md` and `vocabulary-patterns.md` for remediation. A word that is a term of art here belongs in `.slop-config.yaml` with a reason.' \
            "$(cat scan.txt)")"
