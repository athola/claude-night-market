name: Ecosystem Tests (root tests/ suite)

# Runs the root `tests/` suite on every PR.
#
# Why this workflow exists. `make test` shells out to run-plugin-tests.sh, which
# iterates `plugins/*/` and runs one pytest process per plugin. It never sees
# the root `tests/` directory. Neither did any other workflow. The suite that
# checks the things no single plugin can check (that every skill across every
# plugin states a trigger and a boundary; that plugin packages still import when
# pytest runs from the repo root) was therefore in no gate at all, and 75 of its
# assertions failed for months with nothing to report it.
#
# The suite is cross-cutting by nature: a skill added to any plugin is a new
# parametrized case here. That is why the path filter is broad across plugins/
# rather than scoped to a language or directory.
#
# The filter below must stay at least as wide as what the gates read.
# `test_cited_paths_resolve.py` and `test_assets_respect_enforced_vows.py`
# sweep `plugins/*/skills/**/*.md`, `plugins/*/commands/**/*.md`,
# `plugins/*/agents/**/*.md`, and `.claude/rules/*.md`. An earlier version of
# this filter listed only `plugins/**/SKILL.md` and omitted `.claude/`
# entirely, which left 547 of those files unable to trigger the gate that
# reads them: every skill `modules/` file, and every project rule. Too narrow
# a filter does not fail, it reports green by not running.
#
# `plugins/*/hooks/**` and `plugins/*/src/**` are here for
# `test_hooks_import_without_project_deps.py`, which imports every registered
# hook with pyyaml blocked. Hooks import through `src/` packages, so a change
# in either directory can break the import chain that gate checks.
#
# `tests/test_ci_covers_ecosystem_gates.py` derives both sides from their
# sources and fails if they drift apart again.
#
# `**/*.sh`, `scripts/**` and `plugins/*/scripts/**` are here for the
# shellcheck and shfmt gates, and `.github/workflows/**` for the guards that
# read every workflow, such as `test_ci_installs_shell_tooling.py`.

on:
  push:
    branches: [main, master]
    paths:
      - "plugins/*/skills/**"
      - "plugins/*/commands/**"
      - "plugins/*/agents/**"
      - "plugins/*/hooks/**"
      - "plugins/*/src/**"
      - "plugins/abstract/scripts/validate_budget.py"
      - ".claude/rules/**"
      - "tests/**"
      - "conftest.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/**"
      - "**/*.sh"
      - "scripts/**"
      - "plugins/*/scripts/**"
  pull_request:
    paths:
      - "plugins/*/skills/**"
      - "plugins/*/commands/**"
      - "plugins/*/agents/**"
      - "plugins/*/hooks/**"
      - "plugins/*/src/**"
      - "plugins/abstract/scripts/validate_budget.py"
      - ".claude/rules/**"
      - "tests/**"
      - "conftest.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/**"
      - "**/*.sh"
      - "scripts/**"
      - "plugins/*/scripts/**"
  workflow_dispatch:

concurrency:
  group: ecosystem-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem-tests:
    name: root tests/ suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The shellcheck and shfmt gates in tests/ skip when their binary is
      # absent, and the runner image ships no shfmt.
      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          # sha256 of that asset as the GitHub release API publishes it
          # (assets[].digest). A changed binary fails the job here.
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version

      - name: Run root ecosystem suite
        run: make test-ecosystem
