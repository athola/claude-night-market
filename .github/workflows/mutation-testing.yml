name: Mutation Testing (Iron Law Pillar 3)

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to test (or "all")'
        required: false
        default: 'sanctum'
  schedule:
    # Weekly on Sundays at midnight
    - cron: '0 0 * * 0'

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(github.event.inputs.plugin == 'all' && '["sanctum", "abstract", "imbue", "attune"]' || format('["{0}"]', github.event.inputs.plugin || 'sanctum')) }}
    steps:
      - name: Validate plugin name
        env:
          PLUGIN_NAME: ${{ matrix.plugin }}
        run: |
          if ! echo "$PLUGIN_NAME" | grep -qE '^[a-zA-Z0-9-]+$'; then
            echo "::error::Invalid plugin name: must match ^[a-zA-Z0-9-]+$"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        env:
          PLUGIN_NAME: ${{ matrix.plugin }}
        run: |
          cd "plugins/$PLUGIN_NAME"
          uv sync --quiet 2>/dev/null
          # mutmut 3 dropped --paths-to-mutate and --tests-dir. Click exits 2
          # on the unknown option, which read as "survivors found" below.
          uv pip install 'mutmut<3' --quiet

      - name: Run mutation testing
        env:
          PLUGIN_NAME: ${{ matrix.plugin }}
        run: |
          cd "plugins/$PLUGIN_NAME"
          # Build comma-separated list of directories to mutate
          mutate_paths=$(find . -maxdepth 1 -type d \( -name scripts -o -name src \) -printf '%f/,' | sed 's/,$//')
          if [ -n "$mutate_paths" ]; then
            # mutmut 2 exit status is a bit mask: 1 fatal, 2 survivors,
            # 4 timeouts, 8 suspicious. Only the fatal bit fails the job.
            set +e
            uv run mutmut run --paths-to-mutate="$mutate_paths" --tests-dir=tests/ --no-progress
            exit_code=$?
            set -e
            if [ $((exit_code & 1)) -ne 0 ]; then
              echo "::error::mutmut failed with exit code $exit_code"
              exit 1
            fi
            # A run that generated nothing is not a pass.
            mutants=$(uv run mutmut junitxml | grep -o 'tests="[0-9]*"' | head -1 | tr -dc '0-9')
            if [ "${mutants:-0}" -eq 0 ]; then
              echo "::error::mutmut generated no mutants for $mutate_paths"
              exit 1
            fi
            echo "mutmut checked $mutants mutants"
          fi

      - name: Generate report
        if: always()
        env:
          PLUGIN_NAME: ${{ matrix.plugin }}
        run: |
          cd "plugins/$PLUGIN_NAME"
          if [ -f ".mutmut-cache" ]; then
            echo "## Mutation Testing Results: $PLUGIN_NAME" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            uv run mutmut results >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No results available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## Mutation Testing: $PLUGIN_NAME" >> $GITHUB_STEP_SUMMARY
            echo "No Python source files found to mutate." >> $GITHUB_STEP_SUMMARY
          fi
