name: Plugin Tests (per-plugin suites)

# Runs every plugin's own `tests/` directory.
#
# Until this workflow existed, no CI job ran them. `ecosystem-tests.yml`
# runs the root `tests/` suite and `python39-compat.yml` runs only the
# hook subset for the plugins that register hooks, so roughly 13,900
# tests across 23 plugin suites were gated solely by the pre-commit hook
# on a contributor's machine. That is the same silent shape as a
# too-narrow path filter: nothing fails, because nothing runs.
#
# Two properties of the local gate are reproduced here deliberately:
#
#   - Each suite runs from its own plugin directory. Several plugins
#     (memory-palace, gauntlet) resolve conftest and package imports
#     against their own pyproject and fail collection when pytest is
#     invoked from the repository root.
#   - Coverage stays on. Plugin pyprojects set their own thresholds and
#     two plugins (archetypes, cartograph) do not depend on pytest-cov
#     at all, so passing `--no-cov` globally is an error rather than an
#     optimization.
#
# The matrix is discovered rather than listed. A static list would need
# its own gate to stay in step with the directory tree, which is the
# drift `tests/test_ci_covers_ecosystem_gates.py` exists to catch
# elsewhere in this repository.

on:
  push:
    branches: [main, master]
    paths:
      - "plugins/**"
      - ".github/workflows/plugin-tests.yml"
  pull_request:
    paths:
      - "plugins/**"
      - ".github/workflows/plugin-tests.yml"
  workflow_dispatch:

concurrency:
  group: plugin-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover plugin suites
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7

      - name: List plugins that have a tests directory
        id: list
        run: |
          plugins=$(
            find plugins -mindepth 2 -maxdepth 2 -type d -name tests \
              | sed 's|^plugins/||; s|/tests$||' \
              | sort \
              | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))'
          )
          printf 'plugins=%s\n' "${plugins}" >> "${GITHUB_OUTPUT}"
          printf 'discovered: %s\n' "${plugins}"

      - name: Fail if discovery found nothing
        run: |
          # An empty matrix would report success by running no jobs.
          count=$(printf '%s' '${{ steps.list.outputs.plugins }}' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          case "${count}" in
            0) printf 'no plugin test suites discovered\n' >&2; exit 1 ;;
            *) printf 'discovered %s plugin test suites\n' "${count}" ;;
          esac

  plugin-suite:
    name: pytest ${{ matrix.plugin }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # pensive's shell-review suite is the only automated shellcheck and
      # shfmt gate in the repository. Both tests skip when the tool is
      # absent, so without this step they would quietly stop asserting.
      - name: Install shell tooling
        if: matrix.plugin == 'pensive'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version

      - name: Run the plugin suite
        working-directory: plugins/${{ matrix.plugin }}
        run: uv run python -m pytest tests/ -q --tb=short
