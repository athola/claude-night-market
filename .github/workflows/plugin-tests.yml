name: Plugin Tests (per-plugin suites)

# Runs every plugin's own `tests/` directory.
#
# Until this workflow existed, no CI job ran them. `ecosystem-tests.yml`
# runs the root `tests/` suite and `python39-compat.yml` runs only the
# hook subset for the plugins that register hooks, so roughly 13,900
# tests across 23 plugin suites were gated solely by the pre-commit hook
# on a contributor's machine. That is the same silent shape as a
# too-narrow path filter: nothing fails, because nothing runs.
#
# Two properties of the local gate are reproduced here deliberately:
#
#   - Each suite runs from its own plugin directory. Several plugins
#     (memory-palace, gauntlet) resolve conftest and package imports
#     against their own pyproject and fail collection when pytest is
#     invoked from the repository root.
#   - Coverage stays on. Plugin pyprojects set their own thresholds and
#     two plugins (archetypes, cartograph) do not depend on pytest-cov
#     at all, so passing `--no-cov` globally is an error rather than an
#     optimization.
#   - `--all-extras` is required. `uv run` installs a PEP 735
#     `[dependency-groups] dev` by default but not a
#     `[project.optional-dependencies] dev`, and this repository uses
#     both conventions. leyline and phantom declare pytest only in the
#     latter, so without the flag their jobs die on "No module named
#     pytest" -- which does not reproduce locally, where a repo-root
#     `.venv` already has pytest from some earlier run.
#
# The matrix is discovered rather than listed. A static list would need
# its own gate to stay in step with the directory tree, which is the
# drift `tests/test_ci_covers_ecosystem_gates.py` exists to catch
# elsewhere in this repository.
#
# A pull request runs only the suites its change can break: the plugins
# it touches plus their direct dependents, read from
# docs/plugin-dependencies.json by scripts/select_plugin_suites.py. A
# change to configuration every suite reads (root conftest and pyproject,
# plugins/conftest_shared.py, plugins/abstract/config, this file, the
# selector itself) selects every suite, and so does every push to master.

on:
  push:
    branches: [main, master]
    paths:
      - "plugins/**"
      - "conftest.py"
      - "pyproject.toml"
      - "scripts/select_plugin_suites.py"
      - ".github/workflows/plugin-tests.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "conftest.py"
      - "pyproject.toml"
      - "scripts/select_plugin_suites.py"
      - ".github/workflows/plugin-tests.yml"
  workflow_dispatch:

concurrency:
  group: plugin-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover plugin suites
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's base commit must be local to diff against it.
          fetch-depth: 0

      - name: List plugins that have a tests directory
        id: list
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          find plugins -mindepth 2 -maxdepth 2 -type d -name tests \
            | sed 's|^plugins/||; s|/tests$||' \
            | sort > "${RUNNER_TEMP}/discovered.txt"
          all=$(python3 scripts/select_plugin_suites.py < "${RUNNER_TEMP}/discovered.txt")
          case "${EVENT_NAME}" in
            pull_request)
              git diff --name-only "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/changed.txt"
              plugins=$(python3 scripts/select_plugin_suites.py \
                --changed-files "${RUNNER_TEMP}/changed.txt" \
                < "${RUNNER_TEMP}/discovered.txt")
              ;;
            *) plugins="${all}" ;;
          esac
          printf 'all=%s\n' "${all}" >> "${GITHUB_OUTPUT}"
          printf 'plugins=%s\n' "${plugins}" >> "${GITHUB_OUTPUT}"
          printf 'discovered: %s\nselected: %s\n' "${all}" "${plugins}"

      - name: Fail if discovery found nothing
        run: |
          # An empty discovery would report success by running no jobs. An
          # empty selection is legitimate: a PR touching no plugin suite.
          count=$(printf '%s' '${{ steps.list.outputs.all }}' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          case "${count}" in
            0) printf 'no plugin test suites discovered\n' >&2; exit 1 ;;
            *) printf 'discovered %s plugin test suites\n' "${count}" ;;
          esac

  plugin-suite:
    name: pytest ${{ matrix.plugin }}
    needs: discover
    # GitHub rejects a matrix with no values, so skip when nothing was picked.
    if: needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # pensive's shell-review suite is the only automated shellcheck and
      # shfmt gate in the repository, and its pattern-detection tests
      # shell out to ripgrep. The first two skip when the tool is absent,
      # so without this step they would quietly stop asserting; the
      # ripgrep ones fail outright, which is how the runner found them.
      - name: Install shell tooling
        if: matrix.plugin == 'pensive'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version
          rg --version

      - name: Run the plugin suite
        working-directory: plugins/${{ matrix.plugin }}
        run: uv run --all-extras python -m pytest tests/ -q --tb=short
