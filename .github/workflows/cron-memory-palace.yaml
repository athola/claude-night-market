name: Memory Palace Lifecycle Cron

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  vitality-decay-dry-run:
    name: Run vitality decay dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Run vitality decay
        run: |
          uv run python plugins/memory-palace/scripts/update_vitality_scores.py --dry-run --queue-file plugins/memory-palace/data/indexes/vitality-tending-queue.json
